server:
  address: 127.0.0.1

spring:
  config:
    activate:
      on-profile: local-direct
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    openfeign:
      client:
        config:
          auth-back-server:
            url: ${SEMO_AUTH_BASE_URL:http://localhost:9000}

eureka:
  client:
    enabled: false
    registerWithEureka: false
    fetchRegistry: false

semo:
  cors:
    allowed-origins: ${SEMO_CORS_ALLOWED_ORIGINS:http://localhost:3003,http://127.0.0.1:3003}
